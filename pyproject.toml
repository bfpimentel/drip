[project]
name = "drip"
version = "0.1.0"
description = "Simple file upload server with auto-expiration"
dependencies = [
    "flask>=3.0.0",
    "waitress>=3.0.2",
]
requires-python = ">=3.10"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
